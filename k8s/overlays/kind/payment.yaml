apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/part-of: robot-shop
    spec:
      automountServiceAccountToken: false
      containers:
      - name: payment
        image: 542697646590.dkr.ecr.us-east-1.amazonaws.com/robotshop-kind/payment:sha-e6a29b6b98d1-39600051202-1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: AMQP_HOST
          value: rabbitmq
        - name: USER_HOST
          value: user
        - name: CART_HOST
          value: cart
        - name: PAYMENT_GATEWAY
          value: http://catalogue:8080/health
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: robot-shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment
  ports:
  - name: http
    port: 8080
    targetPort: http
