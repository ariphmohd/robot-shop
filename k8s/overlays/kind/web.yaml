apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: robot-shop
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: 542697646590.dkr.ecr.us-east-1.amazonaws.com/robotshop-kind/web:sha-65cc6d5275a5-40263211602-1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: CATALOGUE_HOST
          value: catalogue.robot-shop.svc.cluster.local
        - name: USER_HOST
          value: user.robot-shop.svc.cluster.local
        - name: CART_HOST
          value: cart.robot-shop.svc.cluster.local
        - name: SHIPPING_HOST
          value: shipping.robot-shop.svc.cluster.local
        - name: PAYMENT_HOST
          value: payment.robot-shop.svc.cluster.local
        - name: RATINGS_HOST
          value: ratings.robot-shop.svc.cluster.local
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf.template
          subPath: default.conf.template
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: robot-shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
  - name: http
    port: 8080
    targetPort: http
