apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/part-of: robot-shop
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cart
          image: 542697646590.dkr.ecr.us-east-1.amazonaws.com/robotshop-kind/cart:sha-e6a29b6b98d1-39600051202-1
          # Load the AMD64 image archive into Kind before applying this overlay.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_HOST
              value: redis
            - name: CATALOGUE_HOST
              value: catalogue
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          # /health returns HTTP 200 even if Redis has not connected.
          # Inspect its JSON body rather than treating HTTP 200 as readiness.
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const http = require('http');
                  const req = http.get('http://127.0.0.1:8080/health', res => {
                    let body = '';
                    res.on('data', chunk => body += chunk);
                    res.on('end', () => {
                      try {
                        process.exit(res.statusCode === 200 && JSON.parse(body).redis === true ? 0 : 1);
                      } catch (_) {
                        process.exit(1);
                      }
                    });
                  });
                  req.setTimeout(2000, () => req.destroy());
                  req.on('error', () => process.exit(1));
            periodSeconds: 10
            timeoutSeconds: 5
          # A Redis outage should not repeatedly restart the application.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
