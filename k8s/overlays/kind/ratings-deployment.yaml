apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratings
  labels:
    app.kubernetes.io/name: ratings
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ratings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ratings
        app.kubernetes.io/part-of: robot-shop
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ratings
          image: 542697646590.dkr.ecr.us-east-1.amazonaws.com/robotshop-kind/ratings:sha-e6a29b6b98d1-39600051202-1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PDO_URL
              value: "mysql:host=mysql;dbname=ratings;charset=utf8mb4"
            - name: CATALOGUE_URL
              value: http://catalogue:8080
            - name: APP_ENV
              value: prod
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          # The application health endpoint executes a database query.
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Database outages must not repeatedly restart Apache.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
