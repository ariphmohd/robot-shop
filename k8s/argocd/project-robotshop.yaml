apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: robot-shop
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: robot-shop
spec:
  description: GitOps deployment project for the Robot Shop development environment.
  sourceRepos:
    - https://github.com/ariphmohd/robot-shop.git
  destinations:
    - namespace: robot-shop
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Secret
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
