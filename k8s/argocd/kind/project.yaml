apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: robot-shop-kind
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: robot-shop
    app.kubernetes.io/environment: kind
spec:
  description: Robot Shop local Kind deployment from codex/kind-test.
  sourceRepos:
  - https://github.com/ariphmohd/robot-shop.git
  destinations:
  - namespace: robot-shop
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: networking.k8s.io
    kind: Ingress
