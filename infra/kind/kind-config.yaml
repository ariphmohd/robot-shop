# Local Kubernetes cluster for the codex/kind-test branch.
# This file is used only on the Ubuntu VM hosted in UTM; it creates no AWS
# resources and does not replace the EKS Terraform stages.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: robot-shop-test
networking:
  ipFamily: ipv4
nodes:
  - role: control-plane
    # Pinned to an image released and tested with Kind v0.33.0. The image
    # supports both amd64 and arm64 Ubuntu VMs.
    image: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.33.0@sha256:02f73d6ae3f11ad5d543f16736a2cb2a63a300ad60e81dac22099b0b04784a4e
