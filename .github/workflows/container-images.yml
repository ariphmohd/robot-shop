name: Build and publish container images

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/container-images.yml"
  push:
    branches:
      - codex/kind-test
    paths:
      - "app/**"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_PREFIX: robotshop-kind
  # ECR stores a manifest list under one immutable tag. Docker and Kubernetes
  # then select the matching image automatically from the node CPU architecture.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-publish:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - catalogue
          - cart
          - dispatch
          - payment
          - ratings
          - shipping
          - user
          - web
          - mysql

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # QEMU is only needed for the ARM64 half of the multi-platform publishing
      # build. Pull-request validation remains a fast native AMD64 build.
      - name: Set up QEMU for ARM64 publishing builds
        if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials through GitHub OIDC
        if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          allowed-account-ids: '542697646590'
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "ECR_REGISTRY=${registry}" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"

      - name: Build image for non-release validation
        # Runs outside codex/kind-test validate a native AMD64 image,
        # but cannot assume the AWS role or publish to ECR.
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/codex/kind-test'
        uses: docker/build-push-action@v7
        with:
          context: app/${{ matrix.service }}
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: robotshop-ci/${{ matrix.service }}:${{ github.sha }}
          # Read the matching Kind-branch cache, but do not allow a PR to
          # publish a cache used by publishing builds.
          cache-from: type=gha,scope=robotshop-kind-${{ matrix.service }}

      - name: Define immutable image tag
        if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build and push immutable ECR image
        if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: app/${{ matrix.service }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
          pull: true
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          # Retain a separate shared cache per service. This reduces repeated
          # dependency installation without mixing cache layers between apps.
          cache-from: type=gha,scope=robotshop-kind-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=robotshop-kind-${{ matrix.service }}
