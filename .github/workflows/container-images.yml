name: Build and deploy Robot Shop to Kind
'on':
  pull_request:
    paths:
    - app/**
    - .github/workflows/container-images.yml
    - scripts/ci/plan-images.py
    - scripts/kind/update-image-tags.py
    - tests/test_kind_cd.py
  push:
    branches:
    - codex/kind-test
    paths:
    - app/**
    - .github/workflows/container-images.yml
    - scripts/ci/plan-images.py
    - scripts/kind/update-image-tags.py
    - tests/test_kind_cd.py
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_PREFIX: robotshop-kind
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
jobs:
  plan:
    name: Select changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.plan.outputs.services }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Validate release planning and image updates
      run: python3 -m unittest discover -s tests -p test_kind_cd.py -v
    - name: Validate storefront behavior
      run: node --test app/web/tests/*.test.cjs
    - name: Validate delivery and demo checkout
      run: |
        python3 -m pip install -r app/payment/tests/requirements.txt
        python3 -m unittest discover -s app/payment/tests -v
    - name: Plan image builds
      id: plan
      run: python3 scripts/ci/plan-images.py
  build-and-publish:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
    - name: Check out source
      uses: actions/checkout@v4
    - name: Set up QEMU for ARM64 publishing builds
      if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Configure AWS credentials through GitHub OIDC
      if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        allowed-account-ids: '542697646590'
        role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Log in to Amazon ECR
      if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
        echo "ECR_REGISTRY=${registry}" >> "$GITHUB_ENV"
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
    - name: Build image for non-release validation
      if: github.event_name == 'pull_request' || github.ref != 'refs/heads/codex/kind-test'
      uses: docker/build-push-action@v7
      with:
        context: app/${{ matrix.service }}
        load: true
        platforms: linux/amd64
        pull: true
        push: false
        tags: robotshop-ci/${{ matrix.service }}:${{ github.sha }}
        cache-from: type=gha,scope=robotshop-kind-${{ matrix.service }}
    - name: Build and push immutable ECR image
      if: github.ref == 'refs/heads/codex/kind-test' && github.event_name != 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: app/${{ matrix.service }}
        platforms: ${{ env.IMAGE_PLATFORMS }}
        pull: true
        push: true
        tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha,scope=robotshop-kind-${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=robotshop-kind-${{ matrix.service }}
    needs:
    - plan
    if: needs.plan.outputs.has_changes == 'true'
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
  publish-manifests:
    name: Publish image tags for Argo CD
    needs:
    - plan
    - build-and-publish
    if: github.repository == 'ariphmohd/robot-shop' && github.ref == 'refs/heads/codex/kind-test' && github.event_name
      != 'pull_request' && vars.KIND_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SERVICES_JSON: ${{ needs.plan.outputs.services }}
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      ECR_REGISTRY: 542697646590.dkr.ecr.us-east-1.amazonaws.com
    steps:
    - name: Check out deployment branch
      uses: actions/checkout@v4
      with:
        ref: codex/kind-test
        fetch-depth: 0
    - name: Ignore superseded source revisions
      id: source
      shell: bash
      run: |-
        set -euo pipefail
        if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "Newer commits are present; this run will not deploy an older source revision." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "current=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Prepare selected image references
      if: steps.source.outputs.current == 'true'
      shell: bash
      run: |-
        set -euo pipefail
        python3 scripts/kind/update-image-tags.py \
          --tag "$IMAGE_TAG" --services "$SERVICES_JSON" --registry "$ECR_REGISTRY"
        git diff --check
    - name: Publish image tags to Git
      id: publish
      if: steps.source.outputs.current == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin codex/kind-test
        if [[ "$(git rev-parse origin/codex/kind-test)" != "$GITHUB_SHA" ]]; then
          echo "Branch advanced during manifest preparation; refusing to overwrite or deploy an older revision."
          exit 1
        fi
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add k8s/overlays/kind/
        if git diff --cached --quiet; then
          echo "No image changes to publish."
        else
          git commit -m "Deploy Kind images $IMAGE_TAG"
          git push origin HEAD:codex/kind-test
        fi
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        {
          echo "### Desired image tags published"
          echo "Image tag: $IMAGE_TAG"
          echo "Services: $SERVICES_JSON"
          echo "Argo CD will reconcile Git; this job does not confirm cluster rollout."
        } >> "$GITHUB_STEP_SUMMARY"
