<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#9d00ff" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hex Shield -->
  <polygon points="60,4 108,30 108,90 60,116 12,90 12,30" 
           fill="#080e1c" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Inner Tech Shield -->
  <polygon points="60,12 100,34 100,86 60,108 20,86 20,34" 
           fill="#040813" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6"/>

  <!-- Robot Head Antennas/Ears -->
  <rect x="25" y="46" width="6" height="24" rx="3" fill="url(#cyberGrad)" />
  <rect x="89" y="46" width="6" height="24" rx="3" fill="url(#cyberGrad)" />
  
  <!-- Robot Face Core -->
  <path d="M 34 38 L 86 38 L 82 82 L 60 95 L 38 82 Z" fill="#0d192f" stroke="url(#cyberGrad)" stroke-width="2"/>
  
  <!-- Visor / Eyes -->
  <path d="M 40 50 Q 60 46 80 50 L 78 62 Q 60 58 42 62 Z" fill="url(#visorGrad)" filter="url(#neonGlow)"/>
  
  <!-- Visor Scanning Glare -->
  <path d="M 46 52 L 56 52 L 52 59 L 44 59 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Mouth Grille / Sensor Grid -->
  <line x1="48" y1="72" x2="72" y2="72" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="52" y1="78" x2="68" y2="78" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="56" y1="84" x2="64" y2="84" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Forehead Core Node / Crest -->
  <circle cx="60" cy="28" r="4.5" fill="#00ff88" filter="url(#neonGlow)"/>
  <line x1="60" y1="18" x2="60" y2="24" stroke="#00ff88" stroke-width="2"/>
</svg>
